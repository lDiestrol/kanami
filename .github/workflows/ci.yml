name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: kanami_ci
          POSTGRES_PASSWORD: kanami_ci
          POSTGRES_DB: kanami_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kanami_ci -d kanami_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "latest-known"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install locked dependencies
        run: uv sync --locked

      - name: Run full test suite
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://kanami_ci:kanami_ci@127.0.0.1:5432/kanami_test
        run: uv run pytest -q

      - name: Run Ruff lint
        run: uv run ruff check .

      - name: Check Ruff formatting
        run: uv run ruff format --check .

      - name: Check lockfile
        run: uv lock --check

      - name: Check Git diff
        run: git diff --check
